<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Step 1 Complete — Getkey</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/guard.js"></script>
<script src="/js/inspect-roast.js"></script>
</head>
<body>

<div class="wrapper">
  <div class="card" style="text-align:center;">

    <div class="header" style="justify-content:center;margin-bottom:24px;">
      <div class="brand">
        <div class="logo" style="background:#10b981;box-shadow:0 8px 20px -6px rgba(16,185,129,0.6);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <div class="brand-name">Step 1 <span style="color:#34d399;">Complete</span></div>
      </div>
    </div>

    <div class="info-box" style="border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.06);text-align:left;">
      <div class="info-icon" style="background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <div>
        <p>Step 1 done. Redirecting you back...</p>
        <p>Please wait, you will be taken to the Getkey tab automatically.</p>
      </div>
    </div>

    <div style="height:20px;"></div>

    <div class="countdown" id="redirectCountdown">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      <span>Redirecting in <strong id="redirectTimer">3</strong>s</span>
    </div>

    <div style="height:14px;"></div>

    <a href="/" class="btn-outline" id="manualBack" style="text-decoration:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Back to Getkey</span>
    </a>

  </div>

  <p class="footer">© 2026 Getkey · Secured by End-to-End Encryption</p>
</div>

<script>
(function () {
  var countdownEl = document.getElementById("redirectTimer");
  var manualBtn = document.getElementById("manualBack");
  var count = 3;

  function goHome() {
    window.location.replace("/");
  }

  var iv = setInterval(function () {
    count -= 1;
    if (countdownEl) countdownEl.textContent = String(Math.max(count, 0));
    if (count <= 0) {
      clearInterval(iv);
      goHome();
    }
  }, 1000);

  if (manualBtn) {
    manualBtn.addEventListener("click", function (e) {
      e.preventDefault();
      clearInterval(iv);
      goHome();
    });
  }
})();
</script>

</body>
</html>
